<!DOCTYPE html>
<html>
<body>
    <h2>Set New Password</h2>
    <input type="password" id="new_pass" placeholder="Enter New Password">
    <button onclick="updatePassword()">Save Password</button>

    <script>
        async function updatePassword() {
            const urlParams = new URLSearchParams(window.location.search);
            const emp_id = urlParams.get('id');
            const new_password = document.getElementById('new_pass').value;

            const response = await fetch('https://canteen-portal-api.onrender.com/change-password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ emp_id: emp_id, new_password: new_password })
            });

            if (response.ok) {
                alert("Password set! Please login again.");
                window.location.href = "index.html";
            }
        }
    </script>
</body>
</html>
