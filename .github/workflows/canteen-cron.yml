# ═══════════════════════════════════════════════════════════════
# Canteen Portal — keep-warm + daily reminders
#
# One job, every 30 minutes. It warms the Render service and then
# calls /push/run-reminders, which checks the reminder_hours row in
# Supabase and returns immediately if no round is due.
#
# That means you change the reminder timings in Supabase, NOT here.
# Nothing in this file needs editing when the schedule changes.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   API_BASE         https://canteen-portal-api.onrender.com
#   REMINDER_SECRET  the same value set on the Render service
# ═══════════════════════════════════════════════════════════════
name: Canteen keep-warm and reminders

on:
  schedule:
    # Every 30 minutes, 00:00–17:00 UTC = 05:30–22:30 IST.
    # Widen this only if you move a reminder outside those hours.
    - cron: "0,30 0-17 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send a round now, ignoring the schedule"
        type: boolean
        default: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the service
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 \
              "${{ secrets.API_BASE }}/ping") || code=""
            [ "$code" = "200" ] && break
            echo "attempt $i returned ${code:-timeout} — cold start, retrying"
            sleep 20
          done
          echo "ping returned ${code:-none}"
          [ "$code" = "200" ]

      - name: Run any reminder round that is due
        run: |
          FORCE="${{ github.event.inputs.force }}"
          URL="${{ secrets.API_BASE }}/push/run-reminders"
          [ "$FORCE" = "true" ] && URL="$URL?force=true"
          curl -sS --fail-with-body --max-time 120 \
            -X POST "$URL" \
            -H "X-Reminder-Secret: ${{ secrets.REMINDER_SECRET }}"
