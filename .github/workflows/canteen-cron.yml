# ═══════════════════════════════════════════════════════════════
# Canteen Portal — keep-warm + daily reminders
#
# One job, every 30 minutes. It wakes the Render service, then calls
# /push/run-reminders, which reads the reminder_hours row in Supabase
# and returns immediately if no round is due.
#
# Change reminder timings in SUPABASE, not here.
#
# CONFIG — these live in GITHUB, not Render. Render's environment
# variables are invisible to GitHub Actions; they are two separate
# systems that never see each other.
#
#   API_BASE         defaults to the URL below. Override it only if the
#                    backend moves: GitHub repo → Settings → Secrets and
#                    variables → Actions → Variables tab.
#   REMINDER_SECRET  optional. Set it here (Secrets tab) only if you also
#                    set REMINDER_SECRET on the Render web service.
# ═══════════════════════════════════════════════════════════════
name: Canteen keep-warm and reminders

on:
  schedule:
    # Every 10 min, 00:00–17:00 UTC = 05:30–22:30 IST.
    # MUST be under 15 minutes: Render's free tier spins the service down
    # after 15 minutes with no inbound request, and the cold start that
    # follows takes most of a minute. At 30 minutes the service was asleep
    # for half of every cycle.
    - cron: "*/10 0-17 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send a round now, ignoring the schedule"
        type: boolean
        default: true

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      # Public URL, so a plain default is fine — no secret needed.
      API_BASE: ${{ vars.API_BASE || secrets.API_BASE || 'https://canteen-api-service.onrender.com' }}
      REMINDER_SECRET: ${{ secrets.REMINDER_SECRET }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "$API_BASE" ]; then
            echo "::error::API_BASE resolved to empty. Set it in GITHUB (repo → Settings → Secrets and variables → Actions → Variables), not in Render."
            exit 1
          fi
          case "$API_BASE" in
            https://*) ;;
            *) echo "::error::API_BASE must start with https:// — got '$API_BASE'"; exit 1 ;;
          esac
          echo "Using API_BASE = $API_BASE"
          [ -z "$REMINDER_SECRET" ] && echo "::warning::REMINDER_SECRET is empty. That is fine only if the server has no REMINDER_SECRET set."
          exit 0

      - name: Wake the service
        id: wake
        run: |
          BASE="${API_BASE%/}"
          for i in 1 2 3 4 5 6; do
            http=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 100 "$BASE/ping" 2>/tmp/err); rc=$?
            echo "attempt $i — curl exit=$rc, http=${http:-none} $( [ -s /tmp/err ] && cat /tmp/err )"
            if [ "$rc" = "0" ] && [ "$http" = "200" ]; then
              echo "Service is awake."; exit 0
            fi
            # Explain the common failures rather than just retrying blindly
            case "$rc" in
              3) echo "::error::curl rejected the URL. API_BASE is malformed."; exit 1 ;;
              6) echo "::error::Could not resolve the host. Check the URL is your live Render domain."; exit 1 ;;
            esac
            if [ "$http" = "404" ]; then
              echo "::error::/ping returned 404 — the deployed backend predates this endpoint. Redeploy the API."
              exit 1
            fi
            echo "  cold start or still booting, waiting 25s"
            sleep 25
          done
          echo "::error::Service did not respond after 6 attempts."
          exit 1

      - name: Run any reminder round that is due
        run: |
          BASE="${API_BASE%/}"
          URL="$BASE/push/run-reminders"
          [ "${{ github.event.inputs.force }}" = "true" ] && URL="$URL?force=true"
          body=$(curl -sS -w '\n%{http_code}' --max-time 120 \
            -X POST "$URL" -H "X-Reminder-Secret: $REMINDER_SECRET")
          code=$(echo "$body" | tail -n1)
          echo "$body" | sed '$d'
          if [ "$code" != "200" ]; then
            echo "::error::run-reminders returned HTTP $code"
            exit 1
          fi
